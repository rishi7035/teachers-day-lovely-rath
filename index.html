<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="A special Teachers' Day greeting for Mrs. Lovely Rath."
  />

  <meta name="theme-color" content="#0b1020" />

  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <link
    rel="shortcut icon"
    type="image/png"
    href="img/favicon.png"
  />

  <title>Happy Teachers' Day — Mrs. Lovely Rath</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Main Styles -->
  <link
    rel="stylesheet"
    href="./style/main.css"
  />
</head>

<body>

  <!-- Background Music
       The actual music file will be configured later. -->
  <audio
    class="song"
    loop
    preload="auto"
  >
    <source src="" type="audio/mpeg">
  </audio>

  <!--
    All animated sections are rendered here
    automatically from config.js.
  -->
  <main
    class="container"
    aria-label="Teachers' Day greeting"
  ></main>

  <!-- Animation Library -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
  ></script>

  <!-- Alert / Music Permission -->
  <script
    src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
  ></script>

  <!-- Website Configuration -->
  <script src="./config.js"></script>

  <!-- Animation Engine -->
  <script src="./script/main.js"></script>

</body>

</html>
