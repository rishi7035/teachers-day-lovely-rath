<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#080b12"
  >

  <meta
    name="description"
    content="A special Teachers' Day greeting for Mrs. Lovely Rath."
  >

  <title>
    Happy Teachers' Day — Mrs. Lovely Rath
  </title>

  <!-- Google Font -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- Main stylesheet -->

  <link
    rel="stylesheet"
    href="./style/main.css"
  >

</head>


<body>

  <!-- Background music -->

  <audio
    class="song"
    loop
    preload="auto"
  ></audio>


  <!--
    All animation is generated
    by script/main.js
  -->

  <main
    class="container"
    aria-label="Teachers' Day greeting"
  ></main>


  <!-- GSAP animation engine -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
  ></script>


  <!-- Configuration -->

  <script src="./config.js"></script>


  <!-- Main animation -->

  <script src="./script/main.js"></script>

</body>

</html>
